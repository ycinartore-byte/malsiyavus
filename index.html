<!DOCTYPE html>
<html>
<head>
  <title>Malsiyavuş</title>

  <style>
    body {
      margin:0;
      font-family:Arial;
      text-align:center;
    }

    .poem {
      white-space:pre-line;
      margin-top:20px;
    }

    .container {
      display:flex;
      justify-content:center;
      gap:20px;
      margin-top:20px;
    }

    button {
      padding:10px 15px;
      font-size:16px;
    }

    #game {
      display:none;
      position:relative;
      width:100vw;
      height:100vh;
      background:#f2f2f2;
      overflow:hidden;
    }

    #player, #enemy {
      position:absolute;
      width:40px;
      height:40px;
      border-radius:8px;
    }

    #player {
      background:blue;
    }

    #enemy {
      background:red;
    }

    #controls {
      position:fixed;
      bottom:10px;
      left:50%;
      transform:translateX(-50%);
      display:grid;
      grid-template-columns:50px 50px 50px;
      grid-template-rows:50px 50px;
      gap:5px;
    }

    #controls button {
      font-size:20px;
    }

    #up { grid-column:2; grid-row:1; }
    #left { grid-column:1; grid-row:2; }
    #down { grid-column:2; grid-row:2; }
    #right { grid-column:3; grid-row:2; }

    #timer {
      position:fixed;
      top:10px;
      left:10px;
      font-size:20px;
    }
  </style>
</head>

<body>

<!-- ANA SAYFA -->
<div id="menu">

<h1>Malsiyavuş</h1>

<img src="Screenshot_20260524-083720.WhatsApp~2.jpg" style="width:250px;">

<div class="poem">

İki adımda yorulursun  
Çıkamazsın yokuş

Cr de beni yenemezsin  
Anca boş boş konuş

Rüyaya dalınca  
Mega şovalyelere kavuş

Sen ne mal insansın  
Siyavuş Siyavuş

</div>

<h2>Siyavuş mal mı?</h2>

<div class="container">
  <button onclick="startGame()">Siyavuş’dan Kaç</button>
</div>

</div>

<!-- OYUN -->
<div id="game">
  <div id="timer">0.0s</div>
  <div id="player"></div>
  <div id="enemy"></div>

  <div id="controls">
    <button id="up">↑</button>
    <button id="left">←</button>
    <button id="down">↓</button>
    <button id="right">→</button>
  </div>
</div>

<script>
let player = document.getElementById("player");
let enemy = document.getElementById("enemy");
let game = document.getElementById("game");
let menu = document.getElementById("menu");
let timerText = document.getElementById("timer");

let px = 50, py = 50;
let ex = 200, ey = 200;

let speed = 8;
let startTime;
let timerInterval;

function startGame(){
  menu.style.display = "none";
  game.style.display = "block";

  px = 50; py = 50;
  ex = 300; ey = 300;

  startTime = Date.now();

  timerInterval = setInterval(()=>{
    let t = ((Date.now() - startTime)/1000).toFixed(1);
    timerText.innerText = t + "s";
  },100);

  gameLoop();
}

function movePlayer(dx,dy){
  px += dx;
  py += dy;
}

function moveEnemy(){
  if(px < ex) ex -= speed;
  if(px > ex) ex += speed;
  if(py < ey) ey -= speed;
  if(py > ey) ey += speed;
}

function checkCollision(){
  if(Math.abs(px-ex)<30 && Math.abs(py-ey)<30){
    clearInterval(timerInterval);
    alert("Siyavuş seni " + timerText.innerText + " sürede yakaladı, artık sen de malsın 😎");
    location.reload();
  }
}

function update(){
  player.style.left = px + "px";
  player.style.top = py + "px";

  enemy.style.left = ex + "px";
  enemy.style.top = ey + "px";

  moveEnemy();
  checkCollision();

  requestAnimationFrame(update);
}

update();

// KLAVYE
document.addEventListener("keydown", (e)=>{
  if(e.key=="ArrowUp") py -= speed;
  if(e.key=="ArrowDown") py += speed;
  if(e.key=="ArrowLeft") px -= speed;
  if(e.key=="ArrowRight") px += speed;
});

// MOBİL
document.getElementById("up").onclick = ()=>py-=speed;
document.getElementById("down").onclick = ()=>py+=speed;
document.getElementById("left").onclick = ()=>px-=speed;
document.getElementById("right").onclick = ()=>px+=speed;

</script>

</body>
</html>
