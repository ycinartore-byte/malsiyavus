<!DOCTYPE html>
<html>
<head>
  <title>Malsiyavuş</title>

  <style>
    body {
      text-align:center;
      font-family:Arial;
    }

    #game {
      display:none;
      position:relative;
      width:100vw;
      height:100vh;
      overflow:hidden;
      background:#f2f2f2;
    }

    #player, #enemy {
      position:absolute;
      width:50px;
      height:50px;
    }

    #player {
      background:blue;
    }

    #enemy {
      background:red;
    }

    #controls {
      position:fixed;
      bottom:20px;
      left:50%;
      transform:translateX(-50%);
      display:grid;
      grid-template-columns:50px 50px 50px;
      grid-template-rows:50px 50px;
      gap:5px;
    }

    button {
      font-size:20px;
    }

    #startBtn {
      margin-top:20px;
      padding:10px 20px;
    }

    #poem, #quiz {
      margin-top:20px;
    }
  </style>
</head>

<body>

<h1 id="title">Malsiyavuş</h1>

<img id="img" src="Screenshot_20260524-083720.WhatsApp~2.jpg" style="width:300px; display:block; margin:auto;">

<div id="poem">

İki adımda yorulursun  
Çıkamazsın yokuş

Cr de beni yenemezsin  
Anca boş boş konuş

Rüyaya dalınca  
Mega şovalyelere kavuş

Sen ne mal insansın  
Siyavuş Siyavuş

</div>

<h2 id="quiz">Siyavuş mal mı?</h2>

<button onclick="alert('Doğru cevap: Siyavuş kesinlikle bir mal 😎')">Evet</button>
<button onclick="alert('Yanlış cevap: Cevabı veren kişi kesinlikle bir mal 😎')">Hayır</button>

<br><br>

<button id="startBtn" onclick="startGame()">Siyavuş’dan Kaç</button>

<div id="game">
  <div id="player"></div>
  <div id="enemy"></div>

  <div id="controls">
    <div></div>
    <button onclick="move(0,-20)">⬆</button>
    <div></div>
    <button onclick="move(-20,0)">⬅</button>
    <button onclick="move(0,20)">⬇</button>
    <button onclick="move(20,0)">➡</button>
  </div>

  <h2 id="timer"></h2>
</div>

<script>
let px=100, py=100;
let ex=300, ey=300;
let startTime;
let interval;
let gameStarted=false;

const player=document.getElementById("player");
const enemy=document.getElementById("enemy");
const game=document.getElementById("game");
const timer=document.getElementById("timer");

function startGame(){

  let count=5;
  document.getElementById("startBtn").innerText="Hazırlan: "+count;

  let countdown=setInterval(()=>{
    count--;
    document.getElementById("startBtn").innerText="Hazırlan: "+count;

    if(count===0){
      clearInterval(countdown);
      document.getElementById("startBtn").style.display="none";
      start();
    }
  },1000);
}

function start(){

  document.getElementById("title").style.display="none";
  document.getElementById("img").style.display="none";
  document.getElementById("poem").style.display="none";
  document.getElementById("quiz").style.display="none";

  game.style.display="block";

  player.style.left=px+"px";
  player.style.top=py+"px";

  enemy.style.left=ex+"px";
  enemy.style.top=ey+"px";

  startTime=Date.now();

  interval=setInterval(loop,50);
}

function move(x,y){
  px+=x;
  py+=y;
  player.style.left=px+"px";
  player.style.top=py+"px";
}

document.addEventListener("keydown",e=>{
  if(e.key==="ArrowUp")move(0,-20);
  if(e.key==="ArrowDown")move(0,20);
  if(e.key==="ArrowLeft")move(-20,0);
  if(e.key==="ArrowRight")move(20,0);
});

function loop(){

  // enemy chase
  if(px<ex)ex-=2;
  if(px>ex)ex+=2;
  if(py<ey)ey-=2;
  if(py>ey)ey+=2;

  enemy.style.left=ex+"px";
  enemy.style.top=ey+"px";

  let dx=px-ex;
  let dy=py-ey;
  let dist=Math.sqrt(dx*dx+dy*dy);

  let time=((Date.now()-startTime)/1000).toFixed(1);
  timer.innerText="Süre: "+time+" sn";

  if(dist<40){
    clearInterval(interval);
    alert("Siyavuş seni "+time+" saniyede yakaladı, artık sende malsın 😎");
    location.reload();
  }
}
</script>

</body>
</html>
