<!DOCTYPE html>
<html>
<head>
  <title>Malsiyavuş</title>

  <style>
    body {
      text-align:center;
      font-family:Arial;
    }

    .container {
      display:flex;
      justify-content:center;
      gap:20px;
      margin-top:20px;
    }

    button {
      padding:10px 20px;
      font-size:18px;
    }
  </style>
</head>

<body>

<h1>Malsiyavuş</h1>

<img src="Screenshot_20260524-083720.WhatsApp~2.jpg" style="width:300px; display:block; margin:auto;">

<br>

İki adımda yorulursun  
Çıkamazsın yokuş

Cr de beni yenemezsin  
Anca boş boş konuş

Rüyaya dalınca  
Mega şovalyelere kavuş

Sen ne mal insansın  
Siyavuş Siyavuş

<br><br>

<h2>Siyavuş mal mı?</h2>

<div class="container">
  <button id="evet">Evet</button>
  <button id="hayir">Hayır</button>
</div>

<script>
const evet = document.getElementById("evet");
const hayir = document.getElementById("hayir");

function swap() {
  const parent = evet.parentNode;

  // yer değiştir
  if (parent.children[0] === evet) {
    parent.insertBefore(hayir, evet);
  } else {
    parent.insertBefore(evet, hayir);
  }
}

setInterval(swap, 500);

function result() {
  alert("Doğru cevap: Siyavuş tam bir mal 😎");
}

evet.onclick = result;
hayir.onclick = result;
</script>

</body>
</html>
