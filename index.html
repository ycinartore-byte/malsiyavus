  <title>Malsiyavuş</title>

<body style="text-align:center; font-family:Arial; white-space:pre-line;">

<h1>Malsiyavuş</h1>

İki adımda yorulursun  
Çıkamazsın yokuş

Cr de beni yenemezsin  
Anca boş boş konuş

Rüyaya dalınca  
Mega şovalyelere kavuş

Sen ne mal insansın  
Siyavuş Siyavuş

</body>
